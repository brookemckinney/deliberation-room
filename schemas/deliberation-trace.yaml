# Deliberation Room deliberation-trace schema
#
# Status:
#   Provisional research schema.
#
# Purpose:
#   Represent meaningful cognitive and interactional events
#   without requiring preservation of a complete raw transcript.
#
# The trace records development, not merely turn order.
#
# Important:
#   A system move that elicits a human insight does not make
#   the resulting insight system-originated.
#
#   A system proposal that is merely acknowledged does not
#   automatically become human-owned understanding.

schema_version: "0.1"

