        domain: []

        relationship: []

        discourse_community: []

        cross_context: []

      model_status:

        confidence: null

        human_confirmed: false

        last_updated_from_event: null


    local_semantics:

      vocabulary:

        - form: null

          local_meaning: null

          literal_or_general_meaning: null

