# Evidence and Retrieval Layer

The Evidence and Retrieval Layer supplies external and historical information to both engines of Deliberation Room.

Its purpose is not to maximize how much information the system knows about a person.

Its purpose is to answer:

> **What evidence is actually necessary to improve the next cognitive move or the final rhetorical realization, and how trustworthy, current, relevant, and interactionally appropriate is that evidence?**

The layer may draw from:

```text
CURRENT HUMAN INTERACTION

USER-PROVIDED SPEECH / TEXT

TASK HISTORY

RELATIONSHIP-SPECIFIC HISTORY

REASONING HISTORY

DOMAIN-SPECIFIC KNOWLEDGE

DISCIPLINARY / GENRE CONVENTIONS

LINGUISTIC / SOCIOLINGUISTIC EVIDENCE

MODEL PRIOR KNOWLEDGE

OPTIONAL RETRIEVAL / WEB RESEARCH

EXTERNAL PRIMARY SOURCES
```

These sources are not equivalent.

The architecture should preserve where evidence came from, what kind of claim it supports, and how strongly it should influence system behavior.

---

# 1. Why an Evidence Layer Exists

A large language model already contains substantial prior knowledge about:

- language;
- genre;
- rhetoric;
- discourse;
- common idioms;
- cultural references;
- disciplinary terminology;
- conversational norms;
- writing conventions;
- and broad patterns of human interaction.

A retrieval-capable system may additionally access:

- current public information;
- academic research;
- institutional policies;
- primary sources;
- professional conventions;
- contemporary discourse;
- current slang;
- technical documentation;
- and audience-relevant public context.

A personalized system may also have access to:

- the human's current language;
- previously supplied writing;
- corrections;
- relationship-specific vocabulary;
- prior reasoning traces;
- and selected persistent state.

The architectural problem is therefore not:

```text
HOW CAN THE SYSTEM GET MORE INFORMATION?
```

It is:

```text
WHICH INFORMATION SHOULD MATTER?

FOR WHAT PURPOSE?

WITH WHAT CONFIDENCE?

FOR HOW LONG?

AND SHOULD IT AFFECT:

UNDERSTANDING?

NEXT-MOVE SELECTION?

RESEARCH SUPPORT?

OR FINAL LANGUAGE?
```

---

# 2. Evidence Is Function-Specific

The same evidence may be useful for one function and inappropriate for another.

For example:

```text
Evidence:
A discourse community commonly uses the term "bro" affiliatively.

Useful for:
interpreting the user's language.

Not sufficient for:
authorizing the system to say "bro" to the user.
```

Likewise:

```text
Evidence:
A recipient recently experienced a public professional setback.

Useful for:
avoiding an insensitive interaction.

Not necessarily appropriate for:
mentioning the setback in the final utterance.
```

Therefore every evidence object should be evaluated separately for:

```text
INTERPRETATION USE

METACOGNITIVE CONTROL USE

RHETORICAL PLANNING USE

LINGUISTIC REALIZATION USE

EXPLICIT DISCLOSURE USE
```

These permissions should not be assumed to be identical.

---

# 3. Evidence Hierarchy

Deliberation Room should generally privilege evidence according to relevance and specificity rather than according to a single universal ranking.

However, a useful default ordering is:

```text
1. CURRENT HUMAN CONTRIBUTION

2. HUMAN CORRECTION / REJECTION

3. CURRENT-TASK BEHAVIOR

4. USER-PROVIDED RELEVANT SPEECH OR TEXT

5. RELATIONSHIP- OR DOMAIN-SPECIFIC HISTORY

6. PREVIOUSLY OBSERVED TASK-BOUNDED PATTERNS

7. VERIFIED DOMAIN / GENRE / INSTITUTIONAL EVIDENCE

8. CURRENT EXTERNAL PRIMARY SOURCES

9. CURRENT HIGH-QUALITY SECONDARY SOURCES

10. BASE-MODEL GENERAL KNOWLEDGE

11. BROAD DISCOURSE-COMMUNITY OR COHORT PRIORS

12. DEMOGRAPHIC GENERALIZATION
```

The lower the evidence is on this list, the more cautiously it should generally be used to characterize a specific person.

This is not an absolute ordering.

For factual questions, a current primary source may outrank a user's memory.

For idiolect, the user's actual speech should outrank a style guide.

For disciplinary writing conventions, a field-specific source may be more relevant than general personal language history.

The controller should rank evidence according to the **claim being made**.

---

# 4. Person-Specific Evidence Should Override Broad Priors

Suppose a broad sociolinguistic prior suggests:

```text
members of group X often use linguistic feature Y
```

but the person's actual language repeatedly shows:

```text
feature Y is absent
```

The person-specific evidence should dominate.

Conceptually:

```text
OBSERVED PERSON-SPECIFIC EVIDENCE
        >
BROAD POPULATION PRIOR
```

when the question concerns the behavior of that person.

Broad priors may generate hypotheses.

They should not overwrite direct evidence.

---

# 5. Current-Task Evidence Should Usually Override Historical Personalization

Suppose reasoning history suggests:

```text
analogies were productive in previous tasks
```

but the present interaction shows:

```text
analogies are currently producing confusion

counterexamples are producing useful revision
```

The Metacognitive Controller should prefer the present evidence.

Historical personalization is a prediction source.

It is not destiny.

---

# 6. Evidence Object

A future implementation may represent evidence conceptually as:

```yaml
evidence_id: null

content: null

source_type: null
# current_interaction
# human_correction
# user_provided_language
# reasoning_history
# relational_history
# domain_source
# primary_source
# secondary_source
# model_prior
# discourse_prior
# cohort_prior

source_reference: null

claim_supported: null

function:
  - interpretation

scope:
  task: null
  domain: null
  relationship: null
  discourse_community: null
  temporal: null

freshness:
  retrieved_at: null
  source_date: null
  freshness_required: null

confidence: null

specificity: null

human_confirmed: false

contradicted_by: []

permissions:
  interpretation: true
  metacognitive_control: false
  rhetorical_planning: false
  linguistic_realization: false
  explicit_disclosure: false

persistence:
  allowed: null
  scope: null
```

The precise implementation is open.

The architectural principle is that evidence should carry enough metadata to prevent:

```text
SOMETHING THE SYSTEM KNOWS
```

from silently becoming:

```text
SOMETHING THE SYSTEM SHOULD SAY
```

---

# 7. Source Types

## Current Interaction

The strongest evidence about:

- current meaning;
- current uncertainty;
- current rhetorical purpose;
- current cognitive movement;
- and current language use

often comes from the interaction happening now.

Examples include:

```text
what the human just said
what they rejected
what they revised
which distinction they generated
which wording they corrected
which prompt produced movement
```

This evidence should be highly weighted but still interpreted cautiously.

---

## Human Correction

Human correction is especially high-value evidence.

Examples:

> "No, that's not what I mean."

> "The idea is right, but that phrase sounds nothing like me."

> "That's too formal for David."

> "I'm not angry. I'm trying to tell her I love her."

Correction may update:

```text
cognitive state
metacognitive process state
linguistic model
interaction model
composition contract
```

The architecture should treat correction as evidence, not friction.

---

# 8. User-Provided Speech and Text

The human may supply:

- texts;
- emails;
- essays;
- transcripts;
- posts;
- recordings converted to text;
- prior messages;
- professional writing;
- academic writing;
- or other language samples.

These may support empirical modeling of:

```text
lexicon
syntax
cadence
punctuation
directness
compression
humor
stance
repair
genre switching
idiolect
```

But the architecture should consider:

```text
WHO WAS THE AUDIENCE?

WHAT WAS THE GENRE?

WHEN WAS IT WRITTEN?

WAS THE TEXT EDITED BY SOMEONE ELSE?

IS THIS REPRESENTATIVE OF THE CURRENT TASK?
```

A dissertation chapter should not automatically determine how the human texts their sister.

---

# 9. Contextualized Language Evidence

Observed language should therefore be stored or represented with context.

Conceptually:

```yaml
language_sample:

  source: user_provided

  medium: text_message

  audience_relationship: close_friend

  task: interpersonal_support

  date: null

  observed_features:
    - compressed syntax
    - affectionate teasing
    - high contextual reliance
    - emoji use

  confidence:
    representative_of_context: high
    transferable_to_professional_email: low
```

The architecture should avoid a single universal:

```text
USER STYLE
```

when the evidence supports multiple context-sensitive styles.

---

# 10. Relationship-Specific Evidence

Some linguistic and interactional evidence is local to one relationship.

Examples include:

```text
shared jokes
nicknames
callbacks
repeated metaphors
terms of affection
established teasing
ways of repairing conflict
shared conceptual shorthand
```

This evidence can be extraordinarily valuable for rhetorical compilation.

But it should usually remain scoped to that relationship.

For example:

```text
"San Diego"
```

may have rich relational meaning between two specific people.

It should not become a general user style feature.

---

# 11. Reasoning History

Reasoning History supplies prior evidence to the Metacognitive Controller.

Possible observations include:

```text
single-variable counterfactuals produced revision

analogy was useful during conceptual exploration

direct explanation produced low information gain

classification was productive in technical tasks

concrete examples helped when abstraction stalled
```

These observations should preserve:

```text
task
domain
evidence
confidence
scope
recency
human corrections
```

A mature implementation may decay confidence when observations become old or repeatedly contradicted.

---

# 12. Base-Model Knowledge

The underlying model may already know substantial information about:

```text
grammar
idiom
rhetoric
genres
common discourse norms
disciplinary language
argument structures
cultural references
communication practices
```

This knowledge can be useful without retrieval.

However, model knowledge has limitations:

```text
it may be stale

it may reflect broad averages

it may contain stereotypes

it may hallucinate conventions

it may not distinguish current from historical norms

it may not reflect the user's actual discourse environment
```

Therefore base-model knowledge should usually function as:

```text
A PRIOR
```

rather than:

```text
PERSON-SPECIFIC FACT
```

unless corroborated.

---

# 13. Model Priors Should Generate Hypotheses, Not Identities

The system may know, for example, that a particular humor form is currently common in a discourse community.

That may justify:

```text
candidate interpretation:
this utterance may be playful
```

It does not justify:

```text
this user definitely communicates through that humor style
```

Likewise, cultural or generational knowledge may help explain a phrase.

It should not become a covert demographic personality model.

---

# 14. External Retrieval

Retrieval may be used when the task depends on information that should not be trusted to model memory alone.

Possible retrieval targets include:

```text
current facts
recent events
institutional policy
legal requirements
technical documentation
disciplinary conventions
academic literature
genre examples
public audience context
current terminology
current discourse
```

Retrieval should be triggered by need.

It should not run merely because the system has the ability to search.

---

# 15. Retrieval Gate

Before retrieval, the system should ask:

```text
Would external evidence materially change:

1. factual accuracy?

2. cognitive support?

3. rhetorical credibility?

4. genre fit?

5. audience fit?

6. linguistic interpretation?

7. final wording?
```

If the answer is no, retrieval may be unnecessary.

Possible retrieval decisions include:

```text
NO RETRIEVAL

VERIFY ONE FACT

RETRIEVE ONE PRIMARY SOURCE

CHECK CURRENT TERMINOLOGY

CHECK GENRE CONVENTION

CHECK CURRENT PUBLIC CONTEXT

CHECK DISCIPLINARY EVIDENCE

BROAD RESEARCH REQUIRED
```

---

# 16. Retrieval Should Be Query-Bounded

The system should retrieve for a specific unresolved need.

Bad:

```text
SEARCH EVERYTHING ABOUT DAVID
```

Better:

```text
VERIFY:
whether this technical term is standard in current dialogue-system research
```

Bad:

```text
RESEARCH TINA
```

Better:

```text
NO RETRIEVAL:
relationship-specific language history already answers the rhetorical problem
```

This reduces:

```text
privacy exposure
research visibility
irrelevant context
surveillance cues
cognitive overload
```

---

# 17. Retrieval Can Feed Engine 1

External information may improve deliberation without supplying the judgment.

For example:

```text
HUMAN:
"I think this policy started after 2020."

SYSTEM:
retrieves actual policy chronology

SYSTEM:
provides verified dates

HUMAN:
revises causal interpretation
```

The system supplied information.

The human performed the judgment.

Conceptually:

```text
EXTERNAL EVIDENCE
        ↓
HUMAN COGNITION
        ↓
HUMAN JUDGMENT
```

This is compatible with cognition preservation.

---

# 18. Retrieval Can Feed Engine 2

External evidence may also support rhetorical compilation.

For example:

```text
human judgment:
the architecture may overlap with dialogue-state tracking

retrieval:
find current primary literature

compiler:
phrase novelty claim cautiously and accurately
```

The final text might say:

> The architecture overlaps with established work in dialogue-state tracking and mixed-initiative interaction, while proposing a different optimization target centered on human cognitive continuation.

The factual support came from external evidence.

The interpretive position remains separately attributable.

---

# 19. External Evidence Should Not Silently Become Human Belief

Suppose the system retrieves:

```text
Research source:
X is associated with Y.
```

The final artifact should not automatically state:

```text
I believe X causes Y.
```

unless the human has adopted that judgment.

The architecture should preserve:

```text
EXTERNAL SOURCE CLAIM

HUMAN INTERPRETATION

FINAL RHETORICAL USE
```

as distinguishable objects.

---

# 20. Writing and Genre Conventions

The evidence layer may supply information about writing conventions.

Examples include:

```text
academic argument
literature essay
scientific report
technical documentation
professional memo
grant abstract
discussion post
email
text message
public statement
performance feedback
```

Genre knowledge may come from:

```text
base-model knowledge
institutional examples
style guides
disciplinary sources
user-provided exemplars
retrieval
```

The compiler should distinguish:

```text
GENERAL GENRE CONVENTION
```

from:

```text
LOCAL INSTITUTIONAL EXPECTATION
```

and:

```text
THIS HUMAN'S ACTUAL PRACTICE
```

---

# 21. Genre Convention Is Not Genre Conformity

The compiler should know conventions without blindly reproducing them.

For example:

```text
conventional academic writing:
high nominalization

human / task need:
clarity and direct argument
```

The system may deliberately depart from convention when doing so better serves the rhetorical purpose and does not violate task requirements.

Knowledge of convention expands available choice.

It should not eliminate judgment.

---

# 22. Linguistic and Sociolinguistic Retrieval

Retrieval may sometimes be useful for understanding contemporary language.

Possible questions include:

```text
Is this phrase currently idiomatic?

What does this meme/reference mean?

How is this term used in this professional community?

Is this phrase marked or potentially offensive?

Has the pragmatic meaning of this expression shifted?

What humor style is common in this discourse environment?
```

Sources may include:

```text
corpora
language references
community discourse
current public examples
academic sociolinguistic work
domain-specific sources
```

This evidence should remain lower-confidence for person-specific behavior than direct evidence from the individual.

---

# 23. Cultural Knowledge

Cultural knowledge can affect meaning.

Examples include:

```text
reference
ritual
metaphor
humor
politeness
indirectness
honorific
taboo
genre
social role
```

But culture should not be treated as deterministic.

The system should prefer:

```text
"This form can function as X in this context."
```

over:

```text
"People from this culture communicate this way."
```

The latter is usually too broad to support person-specific inference.

---

# 24. Idiom

Idiomatic language deserves explicit modeling because literal semantics may badly misrepresent interactional meaning.

For example:

```text
"I'm dead."
```

may index:

```text
amusement
disbelief
exaggeration
social alignment
```

rather than mortality.

The evidence layer may use:

```text
base-model language knowledge
local conversation context
discourse-community evidence
relationship-specific history
current retrieval
```

to infer likely meaning.

Meaning should remain uncertainty-aware when multiple readings remain plausible.

---

# 25. Humor Evidence

Humor interpretation may draw from:

```text
lexical form
timing
relationship
prior successful humor
discourse community
generation/cohort evidence
shared reference
prosody if available
```

The system should distinguish:

```text
THIS IS PROBABLY A JOKE
```

from:

```text
I SHOULD MAKE THE SAME KIND OF JOKE
```

Understanding and production permission remain separate.

---

# 26. Speech Data

Where speech data is available, the architecture may eventually model more than text transcription.

Possible signals include:

```text
pause duration
speech rate
prosodic emphasis
pitch movement
hesitation
repair
overlap
laughter
turn length
rhythmic pattern
```

These may contribute to:

```text
stance interpretation
uncertainty
emphasis
humor interpretation
interactional timing
```

But speech-derived psychological inference should remain tightly bounded.

For example:

```text
observed:
long pause before correction
```

does not independently establish:

```text
user is anxious
```

The architecture should preserve the distinction between behavioral evidence and psychological interpretation.

---

# 27. Writing Data

Written-language evidence may include:

```text
lexical frequency
sentence length
syntactic complexity
punctuation
paragraph length
discourse markers
hedging
intensification
quotation behavior
capitalization
emoji
line breaks
revision patterns
```

The purpose is not forensic identification.

The purpose is contextualized rhetorical fit.

---

# 28. Current Language Trends

Some linguistic conventions change quickly.

Examples include:

```text
slang
meme language
platform conventions
emoji pragmatics
professional terminology
AI terminology
online humor
```

Where currency materially affects interpretation or output, retrieval may be preferable to static model priors.

Freshness should be represented explicitly.

---

# 29. Freshness

Evidence may have different temporal requirements.

Examples:

```text
classical rhetorical concept:
low freshness requirement

institutional policy:
high freshness requirement

current slang:
high freshness requirement

relationship-specific nickname:
freshness depends on relationship history

academic theory:
medium freshness requirement depending on claim
```

The system should not apply the same freshness standard to all evidence.

---

# 30. Evidence Conflict

Evidence sources may disagree.

Example:

```text
user's historical writing:
highly formal

current interaction:
casual and compressed

task:
text to close friend
```

The system should not average these mechanically.

It should reason about scope.

Possible resolution:

```text
historical formal writing:
valid for professional domain

current interaction:
stronger evidence for present casual interaction

relationship history:
supports compressed informal realization
```

---

# 31. Contradictory External Sources

External sources may also conflict.

The system should preserve:

```text
source disagreement
source quality
source date
scope
method
```

rather than flattening conflict into one confident answer.

This is especially important when external evidence enters human reasoning.

---

# 32. Evidence Strength

A future evidence scorer might consider:

```text
DIRECTNESS

SPECIFICITY

RECENCY

SOURCE QUALITY

CONTEXTUAL MATCH

REPETITION

HUMAN CONFIRMATION

CONTRADICTION

TRANSFER DISTANCE
```

Conceptually:

```text
high relevance
+
high specificity
+
strong source
+
current evidence
+
human confirmation
=
strong influence
```

This is not currently a validated scoring formula.

---

# 33. Transfer Distance

Evidence gathered in one context should not automatically transfer to another.

Example:

```text
observed:
user writes very formally in grant proposals

target:
text to sibling
```

Transfer distance is high.

By contrast:

```text
observed:
user's recent texts to the same recipient

target:
new text to same recipient
```

Transfer distance is low.

Transfer distance should affect confidence.

---

# 34. Minimum Necessary Evidence

The evidence layer should follow:

> **Use the minimum evidence necessary to materially improve the decision.**

For example, if:

```text
current interaction
+
recipient role
+
known genre
```

already justify the final wording, the system may not need:

```text
web retrieval
historical corpus search
broad cultural inference
```

More data is not automatically better.

---

# 35. Evidence Budget

A mature architecture may maintain an evidence budget.

Conceptually:

```yaml
evidence_budget:

  cognitive_need:
    current_state_sufficient: true

  rhetorical_need:
    audience_context_sufficient: true

  factual_need:
    external_verification_required: false

  linguistic_need:
    current_samples_sufficient: true

  additional_collection:
    justified: false
```

This makes data minimization operational rather than aspirational.

---

# 36. High-Information / Low-Intrusion Retrieval

When additional information is necessary, prefer the smallest query likely to change the system's decision.

For example:

Instead of:

> "Tell me everything about your relationship with this professor."

Ask:

> "Is this professor grading the work you're responding to?"

because power may materially alter the rhetorical move.

Likewise:

Instead of researching a recipient broadly:

```text
verify only the public fact relevant to the message
```

if that is all the compiler needs.

---

# 37. Evidence Permissions

Evidence may require separate permissions.

Conceptually:

```text
MAY USE PRIVATELY TO CALIBRATE
```

does not imply:

```text
MAY REVEAL TO RECIPIENT
```

A future evidence object should therefore support permissions such as:

```text
private_calibration

controller_use

compiler_use

explicit_reference

persistent_storage
```

---

# 38. Research Visibility

The system should consider whether revealing retrieved information will expose the research process.

Example:

```text
system privately knows:
recipient published a paper yesterday
```

Possible utterance:

> "I read your paper yesterday..."

That may be appropriate.

Or it may feel surveillant.

The compiler should estimate:

```text
interactional value
versus
research visibility
```

before surfacing externally retrieved context.

---

# 39. Retrieval and Belonging

More personal knowledge does not necessarily create more belonging.

Sometimes:

```text
less revealed knowledge
+
better recognition
+
more response latitude
```

produces the stronger interaction.

Evidence can improve a relational move by helping the system know what **not to mention**.

---

# 40. Retrieval and the Metacognitive Controller

The controller may request evidence when the human lacks necessary information.

Example:

```text
current cognitive need:
compare two explanations

blocking issue:
one relevant fact is unknown

controller decision:
retrieve fact

then:
return judgment to human
```

A possible internal instruction:

```text
Retrieve the factual chronology.

Do not interpret its significance.

Present the chronology neutrally.

Ask the human whether it changes the causal explanation.
```

This is cognition-preserving retrieval.

---

# 41. Retrieval and the Rhetorical Compiler

The compiler may request evidence when the artifact requires support.

Example:

```text
purpose:
technical critique

claim:
architecture differs from generic dialogue-state tracking

need:
accurate description of related work

retrieval:
primary literature

compiler:
integrate cautious comparison

drift check:
ensure literature summary does not become a stronger novelty claim
```

---

# 42. Evidence Provenance

External evidence should remain provenance-visible.

Possible source classes include:

```text
HUMAN-PROVIDED

MODEL-PRIOR

RETRIEVED-PRIMARY

RETRIEVED-SECONDARY

INSTITUTIONAL

CORPUS

PUBLIC-CONTEXT

UNKNOWN
```

A final artifact may therefore distinguish:

```text
human judgment

system-supplied external fact

joint organization

system-generated wording
```

---

# 43. Evidence and Conceptual Provenance

External evidence can trigger human cognition.

Example:

```text
retrieved fact:
Creon reverses course only after multiple warnings

human:
"Then maybe rigidity matters more than the original decree."
```

Conceptual provenance:

```text
HUMAN_ORIGINATED
```

Metacognitive provenance:

```text
EXTERNAL_EVIDENCE_TRIGGERED
```

Evidentiary provenance:

```text
RETRIEVED_SOURCE
```

This is exactly why multiple provenance dimensions are necessary.

---

# 44. Evidence and Linguistic Provenance

Suppose the system retrieves a field-specific term:

```text
epistemic authority
```

The final artifact may use that term.

That does not necessarily mean the substantive concept originated with the system.

Possible representation:

```text
concept:
human-developed

terminology:
externally supplied

wording:
system-transposed
```

---

# 45. Citation and Attribution

When an artifact requires citation, the compiler should preserve source identity and citation expectations.

Relevant distinctions include:

```text
fact used for internal calibration

fact stated in artifact

quotation

paraphrase

scholarly claim

common knowledge

personal observation
```

These require different attribution behavior.

---

# 46. Evidence for Educational Use

In learning contexts, the evidence layer should respect the learning objective.

For example:

```text
learning objective:
source evaluation

system should not:
perform all source evaluation for learner
```

But:

```text
learning objective:
construct historical argument

system may:
retrieve primary sources

learner must:
evaluate and interpret them
```

The evidence layer should therefore know what cognitive work is being preserved.

---

# 47. Evidence for Rhetorical Tasks

For rhetorical composition, the system may retrieve:

```text
audience expectations

institutional context

genre conventions

public facts

technical terminology

relevant precedent
```

while preserving the human's rhetorical judgment.

---

# 48. Current Culture and Idiomatic Use

A future implementation may query current public language data when:

```text
meaning depends on rapidly changing usage
```

Examples include:

```text
slang
meme language
platform conventions
emoji interpretation
community humor
technical shorthand
```

The system should avoid overclaiming consensus.

Preferred framing:

```text
"This usage appears common in current examples."
```

rather than:

```text
"This is what this generation means."
```

---

# 49. Linguistic Anthropology and Sociolinguistics

The evidence layer may draw conceptually from:

```text
sociolinguistics

linguistic anthropology

conversation analysis

pragmatics

discourse analysis

rhetoric

genre studies
```

These traditions help explain why:

```text
meaning
```

is not recoverable from lexical form alone.

Relevant variables may include:

```text
indexicality
stance
identity positioning
role
register
face
community norms
code-switching
interactional history
```

The architecture should use such concepts to model interaction without pretending that group-level research determines individual behavior.

---

# 50. Data Minimization

Evidence collection creates privacy risk.

Therefore the system should prefer:

```text
ABSTRACTED RELEVANT STATE
```

over:

```text
UNLIMITED RAW PERSONAL HISTORY
```

when equivalent performance is possible.

For example:

Prefer storing:

```text
"dry understatement has been successful in low-stakes exchanges
with this recipient"
```

over indefinitely storing every message ever exchanged.

Whether such abstraction is sufficient remains an empirical question.

---

# 51. Local / On-Device Evidence Processing

Some evidence-processing functions may be candidates for local inference.

Examples include:

```text
idiolect feature extraction

sentence-length statistics

discourse-marker frequency

state summarization

provenance alignment

similarity matching

recent reasoning-history updates
```

This may permit useful personalization without sending all raw personal text to a remote general-purpose model.

This is a research hypothesis, not an implementation guarantee.

---

# 52. Evidence Deletion and Correction

Evidence state should be corrigible.

A human should be able to indicate:

```text
this is outdated

this was context-specific

this inference is wrong

do not generalize this

do not retain this

do not use this relationship history
```

The system should propagate meaningful corrections to dependent representations where feasible.

---

# 53. Failure Modes

## Evidence maximalism

The system assumes more information always improves performance.

## Surveillance personalization

The system accumulates personal history beyond what the interaction requires.

## Stale knowledge

Outdated model priors are treated as current facts.

## Cultural determinism

Group-level evidence becomes a claim about an individual.

## Genre essentialism

Writing convention becomes an inflexible rule.

## Retrieval displacement

Research overwhelms or replaces the human's actual judgment.

## Research visibility failure

The final utterance reveals information that should have remained private calibration.

## Context collapse

Language evidence from one relationship or genre is applied globally.

## Source flattening

Human speech, model prior, and verified external source are treated as equally authoritative.

## Provenance loss

External evidence enters the artifact without remaining distinguishable from human judgment.

## Linguistic cosplay

The system retrieves community language and imitates it without interactional permission.

## Freshness failure

Rapidly changing language or facts are handled using stale knowledge.

## Evidence laundering

A system-generated inference is presented as though supported by an external source.

---

# 54. Evaluation

The Evidence and Retrieval Layer should be evaluated independently.

Possible measures include:

```text
retrieval necessity

source relevance

source quality

freshness

person-specific fit

genre fit

linguistic interpretation accuracy

privacy exposure

research visibility

unnecessary retrieval rate

external-evidence attribution accuracy

semantic drift caused by retrieval

rhetorical improvement attributable to evidence
```

A powerful retrieval system is not successful if it routinely gathers information that does not improve the final decision.

---

# 55. Ablation Questions

The architecture should eventually test:

```text
current interaction only

+

reasoning history

+

user language samples

+

base-model priors

+

domain sources

+

web retrieval
```

to determine which evidence sources materially improve outcomes.

Possible findings may show that some layers add complexity without meaningful benefit.

If so, remove them.

---

# 56. Engine 1 Interface

The Evidence Layer may provide Engine 1 with:

```text
task-relevant factual evidence

disciplinary epistemic rules

reasoning-history observations

current-task intervention evidence

domain terminology

counterexample material

source material for evaluation
```

But Engine 1 remains responsible for determining:

```text
WHAT COGNITIVE OPERATION SHOULD REMAIN WITH THE HUMAN?
```

---

# 57. Engine 2 Interface

The Evidence Layer may provide Engine 2 with:

```text
genre conventions

speaker-language evidence

audience-language evidence

discourse-community conventions

current terminology

rhetorical precedent

relevant factual support

relationship-specific language history

current cultural / idiomatic information
```

But Engine 2 remains responsible for determining:

```text
WHAT EXACT UTTERANCE BEST REALIZES THE HUMAN'S JUDGMENT HERE?
```

