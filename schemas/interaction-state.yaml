# 59. Architectural Principle

The Evidence and Retrieval Layer exists to operationalize a deceptively simple principle:

> **Know only what materially helps.  
> Know where it came from.  
> Know what it permits.**

And specifically for language:

> **General linguistic knowledge can suggest what a form may mean.  
> Individual evidence tells us whether that meaning fits this person.  
> Interactional evidence tells us whether this speaker should use it here.**

And specifically for cognition:

> **The system may supply information.  
> The human must still perform the judgment the task intends to preserve.**

The objective is not maximal knowledge.

It is **appropriately sourced, minimally sufficient evidence in service of better human cognition and more exact rhetorical action.**
