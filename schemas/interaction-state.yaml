# Deliberation Room interaction-state schema
#
# Status:
#   Provisional research schema.
#
# Purpose:
#   Represent the minimum structured state needed to support
#   cognition-preserving next-move selection and situated
#   rhetorical compilation.
#
# Important:
#   This schema does not imply that all fields should be populated,
#   persisted, or inferred in every interaction.
#
#   Representations should remain:
#   - task-relevant
#   - uncertainty-aware
#   - corrigible
#   - minimally sufficient
#   - provenance-preserving
#
#   Unknown should remain unknown.

schema_version: "0.3"

interaction_state:

  session:
    id: null
    task_id: null
    timestamp: null

  goal:
    description: null
    source: null
    confidence: null
    status: active


  # ============================================================
  # MODEL 1 — COGNITIVE STATE
  #
  # What does the human currently appear to think?
  # ============================================================

  cognitive_state:

    observations: []

    claims: []

    assumptions: []

    warrants: []

    evidence:
      supporting: []
      conflicting: []
      unresolved: []

    distinctions: []

    contradictions: []

    counterexamples: []

    alternatives: []

    unresolved_questions: []

    uncertainty: []

    conceptual_stability:
      status: unknown
      confidence: null
      rationale: []
      tested_against: []


  # ============================================================
  # MODEL 2 — METACOGNITIVE PROCESS
  #
  # How is productive cognitive movement occurring RIGHT NOW?
  #
  # This is live controller state.
  # It is not a fixed cognitive type, personality classification,
  # or learning-style profile.
  # ============================================================

  metacognitive_process_model:

    current_operations:

      - operation: null
        # Examples:
        # compare
        # contrast
        # analogize
        # instantiate
        # abstract
        # classify
        # generate_example
        # generate_counterexample
        # test_counterfactual
        # identify_assumption
        # construct_warrant
        # evaluate_evidence
        # isolate_variable
        # trace_causal_chain
        # shift_perspective
        # identify_invariant
        # synthesize
        # revise
        # reject
        # stabilize_judgment

        status: possible
        # possible
        # active
        # productive
        # stalled
        # completed

        evidence_events: []

        confidence: null

        human_confirmed: false

    operation_evidence:

      - operation: null

        attempts: 0

        productive_state_changes: 0

        low_value_responses: 0

        current_support: unknown
        # low
        # moderate
        # high
        # unknown

        evidence_events: []

        confidence: null

    current_cognitive_needs:

      - need: null
        # Examples:
        # expose_assumption
        # test_claim
        # construct_warrant
        # localize_uncertainty
        # identify_invariant
        # instantiate_abstraction
        # abstract_from_examples
        # compare_explanations
        # incorporate_perspective
        # evaluate_evidence
        # stabilize_judgment

        priority: null

        evidence_events: []

        confidence: null

    intervention_response:

      productive_moves: []

      low_value_moves: []

      recent_pattern: null

      diminishing_returns: []

    abstraction_state:

      current_level: unknown
      # concrete
      # mixed
      # abstract
      # unknown

      current_tolerance: unknown
      # low
      # moderate
      # high
      # unknown

      evidence_events: []

      confidence: null

    revision_state:

      recent_revision_types: []

      rejected_system_framings: []

      accepted_system_framings: []

      human_modified_system_framings: []

    uncertainty_state:

      localized: false

      productive_uncertainty: []

      blocking_uncertainty: []

    current_control_signal:

      preferred_operations: []

      deprioritized_operations: []

      exploration_candidates: []

      substitution_risk: null

      controller_instruction: null
      # Example:
      #
      # "Counterfactual testing has recently produced useful
      # revision. Change one variable. Do not supply the likely
      # distinction. Ask what remains invariant."

    task_context:

      domain: null

      disciplinary_walking_rules: []

    model_status:

      confidence: null

      last_updated_from_event: null

      human_corrections: []


  # ============================================================
  # REASONING HISTORY
  #
  # Prior task-bounded evidence that MAY inform Model 2.
  #
  # This is deliberately separate from the live metacognitive
  # process model.
  #
  # Current-task evidence should generally outweigh older patterns.
  # Historical observations should not become fixed cognitive types.
  # ============================================================

  reasoning_history:

    domain_expertise: []

    prior_knowledge: []

    observations:

      - observation: null

        operation: null

        context: null

        domain: null

        source_tasks: []

        evidence_events: []

        confidence: null

        scope: null
        # task
        # domain
        # cross_domain

        human_confirmed: false

        still_supported: null

    transfer_candidates: []

    contradicted_patterns: []

    decay_or_expiration_notes: []

    human_corrections: []


  # ============================================================
  # MODEL 3 — LINGUISTIC / SOCIOLINGUISTIC
  #
  # How does meaning operate for this human in this discourse
  # environment?
  #
  # This is NOT a generic tone or style profile.
  #
  # The model may combine:
  #
  # - observed speech/text behavior
  # - idiolect
  # - local semantics
  # - register
  # - stance
  # - pragmatics
  # - discourse-community conventions
  # - role language
  # - humor and irony
  # - code-switching
  # - generational/cohort evidence
  # - relational language history
  #
  # Critical distinction:
  #
  # UNDERSTAND A FORM
  # does not imply
  # HAVE PERMISSION TO PERFORM A FORM.
  # ============================================================

  linguistic_sociolinguistic_model:

    observed_language_evidence:

      # References to relevant speech/text evidence.
      #
      # An implementation should not automatically retain raw
      # language indefinitely. Where possible, abstracted features
      # may be stored with provenance back to source evidence.

      samples: []

      lexical_patterns:

        frequent_terms: []

        preferred_terms: []

        avoided_terms: []

        jargon_or_domain_terms: []

        recurring_phrases: []

        local_shorthand: []

        lexical_density:
          tendency: null
          confidence: null

        lexical_specificity:
          tendency: null
          confidence: null

      syntactic_patterns:

