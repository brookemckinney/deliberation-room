          tendency: null
          confidence: null

        clause_density:
          tendency: null
          confidence: null

        fragmentation:
          tendency: null
          confidence: null

        coordination_vs_subordination:
          tendency: null
          confidence: null

        question_forms: []

        imperative_forms: []

        declarative_patterns: []

        parenthetical_structure: []

        syntactic_compression_patterns: []

      cadence_patterns:

        rhythm_notes: []

        compression_patterns: []

        elaboration_patterns: []

        pause_or_break_patterns: []

        emphasis_patterns: []

        repetition_patterns: []

        acceleration_patterns: []

        sentence_sequence_patterns: []

      orthographic_patterns:

        capitalization: []

        punctuation: []

        emoji_use: []

        parenthetical_use: []

        dash_use: []

        ellipsis_use: []

        line_break_patterns: []

        emphasis_marking: []

        quotation_patterns: []

      discourse_markers:

        openings: []

        transitions: []

        softeners: []

        intensifiers: []

        repair_markers: []

        stance_markers: []

        agreement_markers: []

        disagreement_markers: []

        topic_shift_markers: []

        closings: []

      explicitness_patterns:

        directness:
          tendency: null
          confidence: null

        implication_vs_explication:
          tendency: null
          confidence: null

        compression:
          tendency: null
          confidence: null

        contextual_reliance:
          tendency: null
          confidence: null

        redundancy_tolerance:
          tendency: null
          confidence: null

      rhetorical_behavior:

        preferred_argument_sequences: []

