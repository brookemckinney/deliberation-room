      last_updated_from_event: null

      human_corrections: []


  # ============================================================
  # MODEL 4 — INTERACTION
  #
  # What does a communicative move DO here, between these
  # participants, for this purpose?
  # ============================================================

  interaction_model:

    participants: []

    roles: []

    institutional_roles: []

    power_relations: []

    status_relations: []

    familiarity:
      level: unknown
      confidence: null

    relational_distance:
      level: unknown
      confidence: null

    relationship_history: []

    trust_signals: []

    face_considerations: []

    belonging_considerations: []

    audience: []

    setting: null

    stakes:
      level: unknown
      dimensions: []

    topic_sensitivity: []

    disclosure_risk:
      level: unknown
      factors: []

    disclosure_pressure:
      level: unknown
      factors: []

    interactional_permissions: []

    interactional_obligations: []

    response_latitude:
      level: unknown
      rationale: []

    asymmetry_of_consequence: []

    asymmetry_of_knowledge: []

    evaluation_risk: []

    vulnerability_factors: []

    ability_to_disengage:
      level: unknown
      constraints: []


  # ============================================================
  # EPISTEMIC STATUS
  #
  # Keep observations, inferences, hypotheses, confirmations,
  # contradictions, and unknowns distinguishable.
  # ============================================================

  epistemic_status:

    observed: []

    inferred: []

    hypothesized: []

    user_confirmed: []

    contradicted: []

    unknown: []


  # ============================================================
  # PROVENANCE
  #
  # Conceptual, metacognitive, and linguistic contribution are
  # distinct.
  # ============================================================

  provenance:

    conceptual_events: []

    metacognitive_events: []

    linguistic_events: []

    external_sources: []


  # ============================================================
  # CURRENT POLICY STATE
  #
  # The policy selects:
  #
  # 1. what cognitive operation should remain with the human;
  # 2. what system move can create conditions for that operation;
  # 3. how that move should be linguistically realized.
  # ============================================================

  current_policy_state:

    candidate_moves: []

    target_cognitive_operation: null

    metacognitive_control_instruction: null
    # Example:
    #
    # "Use one counterfactual. Change only one variable.
    # Do not name the distinction. Ask what remains invariant."

    selected_move:
      action: null
      rationale: null

      expected_cognitive_value: null
      expected_information_gain: null

      expected_productive_state_change: []

      disciplinary_validity: null

      agency_preservation: null
      response_latitude: null
      correctability: null

      cognitive_substitution_risk: null
      intrusion_cost: null
      disclosure_pressure: null
      interactional_risk: null
      premature_certainty_risk: null

    joint_move:
      cognitive_function: null
      linguistic_realization: null
      interactional_affordance: []


  # ============================================================
  # COMPOSITION STATE
  #
  # Deliberation and composition are separate architectural phases.
  #
  # Once the relevant judgment is sufficiently stable, or the
  # human explicitly requests composition, Engine 2 may perform
  # substantial rhetorical and linguistic work.
  # ============================================================

  composition_state:

    mode: deliberation

    readiness:
      status: unknown
      rationale: []

    explicit_human_request: false

    semantic_invariants: []

    material_uncertainties: []

    rhetorical_constraints: []

    interactional_constraints: []

    linguistic_constraints: []

    relevant_external_evidence: []

    permitted_transformations: []

    prohibited_substantive_additions: []

    semantic_drift_flags: []

    interactional_drift_flags: []


  # ============================================================
  # PERSISTENCE
  #
  # State should not automatically become persistent merely because
  # the architecture is capable of representing it.
  # ============================================================

  persistence:

    turn_level: []

    session_level: []

    task_level: []

    domain_level: []

    cross_domain: []

    persistent: []


  # ============================================================
  # MODEL UNCERTAINTY
  # ============================================================

  model_uncertainty:

    unresolved_inferences: []

    conflicting_evidence: []

    low_confidence_representations: []

    correction_needed: []


  # ============================================================
  # HUMAN CORRECTION
  #
  # The human must be able to correct, reject, narrow, or remove
  # system representations.
  # ============================================================

  user_correction:

    pending: false

    corrected_elements: []

    rejected_inferences: []

    narrowed_generalizations: []

    deleted_representations: []
